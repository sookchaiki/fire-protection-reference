05/2026",note:"Added Alert: documenting PFOS-free fire-extinguishing foam on board — verification at first safety-equipment survey after 01/01/2026, three documentation routes (maker declaration / accredited lab test <10 mg/kg / TA-MED certificate), traceability. Source: DNV Technical & Regulatory News, 4 May 2026."},{v:"1.16.0",d:"23/05/2026",note:"Added Alert: DNV — deficiencies in CO₂ fire-extinguishing systems (depleted cylinders from incorrect ultrasonic level gauging and copper bursting-disc fatigue on pre-2016 NK Co. systems). Source: DNV Technical & Regulatory News, 23 Oct 2025."},{v:"1.15.5",d:"23/05/2026",note:"IACS Rec.88 citations (EEBD cylinder hydrostatic test) now link to the IACS recommendation page."},{v:"1.15.4",d:"23/05/2026",note:"Planner: the ‘Approved Service Supplier’ badge is now clickable and opens the Approved Supplier Search tab."},{v:"1.15.3",d:"23/05/2026",note:"Renamed the ‘Suppliers’ tab to ‘Approved Supplier Search’."},{v:"1.15.2",d:"23/05/2026",note:"Supplier Lookup: updated ABS badge colour to #E21E2D and DNV to #009639."},{v:"1.15.1",d:"23/05/2026",note:"Supplier Lookup: each Classification Society badge now uses its brand colour, with automatic black/white text for legibility on light brand colours."},{v:"1.15.0",d:"23/05/2026",note:"Inspection Planner: added ship-type applicability filter, expandable reference-detail panels (SOLAS/MSC/FSS/interpretation + interval basis), an ‘Approved Service Supplier’ badge and supplier-only filter, and quick-access buttons (Find LR Approved Firm / Open Supplier Lookup). Added a Find LR Approved Firm action to the Reference tab. Extended the item data model accordingly."},{v:"1.14.0",d:"23/05/2026",note:"Added ‘Suppliers’ tab — Approved Service Supplier Lookup: searchable cards linking to 12 Classification Society approved-supplier databases (LR pinned first, rest alphabetical by abbreviation)."},{v:"1.13.1",d:"23/05/2026",note:"Footer Source instruments: the instrument number itself is now the link (PDF label removed)."},{v:"1.13.0",d:"23/05/2026",note:"Added professional copyright footer, a Legal tab (Terms of Use & Disclaimer), copyright/author/noarchive metadata, and frontend-protection notes. All Rights Reserved."},{v:"1.12.0",d:"23/05/2026",note:"Reference rows now show related alerts as a single collapsible ‘N related alerts’ toggle (collapsed by default, expand to view and click through), keeping rows clean."},{v:"1.11.4",d:"23/05/2026",note:"Each reference item's source citation is now a clickable link to the relevant instrument (1432, 1516, 1318/Rev.1, 1312, A.951(23)); links disable gracefully when offline."},{v:"1.11.3",d:"23/05/2026",note:"Source instruments in the footer (MSC.1/Circ.1432, 1516, 1318/Rev.1, 1312, A.951(23)) now link to their PDF documents; links disable gracefully when offline."},{v:"1.11.2",d:"23/05/2026",note:"Renamed the ‘Survey planner’ tab to ‘Inspection Planner’ and moved it to the last position (Reference → Alerts → Inspection Planner)."},{v:"1.11.1",d:"23/05/2026",note:"Filled in LR Class News 26/2015 with full details: SOLAS II-2/13.4 means of escape from machinery spaces (MSC.365(93), UI MSC.1/Circ.1511), for new passenger & cargo ships keel-laid on/after 01/01/2016."},{v:"1.11.0",d:"23/05/2026",note:"Alerts: clicking an inline marker in Reference now scrolls to and highlights that specific alert; each alert shows its release date; alerts are ordered chronologically with a Newest/Oldest sort control."},{v:"1.10.1",d:"23/05/2026",note:"Removed the LR Class News 10/2014 alert (carriage of petroleum-oil blends — a cargo item, not fire protection)."},{v:"1.10.0",d:"23/05/2026",note:"Added 22 LR Class News alerts (IMO guideline revisions, SOLAS/FSS amendments, manufacturer recalls, USCG/PSC campaigns, lithium-battery and engine-room safety, China service-supplier rules, etc.). Added an Active/Historical status indicator and filter to the Alerts view."},{v:"1.9.0",d:"23/05/2026",note:"Added Alert: Port State Control Fire Safety Concentrated Inspection Campaign (Paris & Tokyo MoU, Sep–Nov 2023) — indicates PSC fire-safety focus areas (source: LR Class News 16/2023). Updated developer credit to Kittipong Sookchai."},{v:"1.8.1",d:"23/05/2026",note:"Removed the numeric count badge from the Alerts tab."},{v:"1.8.0",d:"23/05/2026",note:"Added Alert (regulation): On-deck container fire protection — SOLAS II-2/10 requires a water mist lance (and mobile water monitors for 5+ container tiers; 2 monitors ≤30 m beam, 4 if wider) on new container-carrying ships built on/after 01/01/2016. Source: LR Class News 02/2015."},{v:"1.7.2",d:"23/05/2026",note:"Ro-Ro fire safety alert: changed the cited source to LR Class News 07/2026 (1 Apr 2026) and added the MSC.1/Circ.1695 detector-spacing unified interpretation."},{v:"1.7.1",d:"23/05/2026",note:"Added an understated developer credit (Kit) with a LinkedIn link in the footer across all views."},{v:"1.7.0",d:"23/05/2026",note:"Added Alert (regulation): Fire safety amendments for Ro-Ro, passenger & cargo ships — SOLAS II-2/7 & 20 and FSS Code Ch.7 & 9 (MSC.550(108)/MSC.555(108)), in force 01/01/2026; affects detection, water-based suppression and structural protection. Summarised from ABS Regulatory News No. 15/2025."},{v:"1.6.0",d:"23/05/2026",note:"Alerts: added search + kind/system filters (scales for future alerts); reframed the CO₂ level-indicator item as a technical recommendation (removed unattributed ‘requires’ wording, no source claimed); added a ‘Recommended’ alert kind."},{v:"1.5.0",d:"23/05/2026",note:"Added Alert: CO₂ cylinder content check by level indicator only valid below 25°C (CO₂ critical temp ~31°C); use weighing where ambient is too high. Basis: MSC.1/Circ.1318/Rev.1 §6.1 content-verification requirement."},{v:"1.4.1",d:"23/05/2026",note:"Renamed the third tab from “Safety alerts” to “Alerts”, since it covers both regulatory changes and safety lessons."},{v:"1.4.0",d:"23/05/2026",note:"Added Safety Alerts & Advisories: PFOS prohibition in fire-extinguishing media (SOLAS II-2/10.11, MSC.532(107), in force 01/01/2026) and MAIB 16/2018 unintended CO₂ release safety lesson; inline advisory markers on affected items."},{v:"1.3.0",d:"22/05/2026",note:"Added Survey Planner: enter a ship build date to generate age-based due/overdue/upcoming periodic items, ranked by priority, with per-item last-completed overrides and category filters."},{v:"1.2.1",d:"22/05/2026",note:"Replaced raw circular filenames with proper document names (notice/circular number + date) for all baseline flags, e.g. Isle of Man → Manx Shipping Notice MSN 057."},{v:"1.2.0",d:"22/05/2026",note:"Added LR Approved Firm lookup: opens the LR Approvals database in a new tab with a suggested search keyword per equipment type; shown only for service-supplier-relevant systems; disables gracefully when offline."},{v:"1.1.0",d:"22/05/2026",note:"Added Smart Natural-Language Search (synonyms, fuzzy/typo tolerance, interval-phrase recognition, ranked results, suggestions, did-you-mean)."},{v:"1.0.2",d:"22/05/2026",note:"Cross-checked against ClassNK Table-1: added Quarterly water-quality (1516 §6.5) and EEBD hydrostatic (IACS Rec.88); updated flag circular references and added Japan, Malaysia, Myanmar, Switzerland, United States."},{v:"1.0.1",d:"22/05/2026",note:"Cross-checked against LR guidance note: added 2-Year water-mist cylinder check for table parity."},{v:"1.0.0",d:"22/05/2026",note:"Initial reference tool: 7 intervals, 10 system media, IMO baseline + flag overlays, offline single-file build with embedded fonts."}],INTERVALS=["Weekly","Monthly","Quarterly","Annual","2-Year","5-Year","10-Year"],INTERVAL_RANK=Object.fromEntries(INTERVALS.map((e,t)=>[e,t])),LR_APPROVALS_URL="https://www.lr.org/en/services/classification-certification/materials-equipment-components-product-certification/lr-approvals/",APPROVAL_SEARCH_MAP={detection:"fire detection and alarm system",water:"water mist fire extinguishing system",foam:"foam fire extinguishing system",gas:"fixed gas fire extinguishing system",powder:"dry powder fire extinguishing system",aerosol:"aerosol fire extinguishing system",portable:"portable fire extinguisher servicing",ba:"breathing apparatus servicing"};function hasApprovalLookup(e){return Object.prototype.hasOwnProperty.call(APPROVAL_SEARCH_MAP,e)}function approvalUrl(){return LR_APPROVALS_URL}const MEDIA=[{id:"all",label:"All systems",short:"All"},{id:"detection",label:"Detection & alarm",short:"Detection"},{id:"water",label:"Water mist / spray / sprinkler",short:"Water mist"},{id:"foam",label:"Foam",short:"Foam"},{id:"gas",label:"Fixed gas (incl. CO₂)",short:"Fixed gas"},{id:"powder",label:"Dry chemical powder",short:"Powder"},{id:"aerosol",label:"Aerosol",short:"Aerosol"},{id:"portable",label:"Portable / wheeled extinguishers",short:"Portable"},{id:"ba",label:"Breathing apparatus / EEBD",short:"BA / EEBD"},{id:"structural",label:"Doors / dampers / ventilation",short:"Doors/vent"},{id:"lighting",label:"Low-location lighting",short:"LL lighting"}],TASKS=[{i:"Weekly",m:"detection",t:"Verify all fire detection & alarm control panel indicators are functional via the lamp/indicator test switch.",src:"1432 §4.1"},{i:"Weekly",m:"gas",t:"Verify all fixed gas system control panel indicators are functional (lamp/indicator test); verify all control/section valves are in correct position.",src:"1432 §4.2"},{i:"Weekly",m:"structural",t:"Verify all fire door control panel indicators (if provided) are functional.",src:"1432 §4.3"},{i:"Weekly",m:"detection",t:"Verify public address and general alarm systems are functioning properly.",src:"1432 §4.4"},{i:"Weekly",m:"ba",t:"Examine all breathing apparatus and EEBD cylinder gauges to confirm correct pressure range.",src:"1432 §4.5"},{i:"Weekly",m:"lighting",t:"Verify low-location lighting is functional by switching off normal lighting in selected locations.",src:"1432 §4.6"},{i:"Weekly",m:"water",t:"Verify control panel indicators & alarms functional; visually inspect pump unit & fittings; check pump unit valve positions (if not locked).",src:"1432 §4.7"},{i:"Monthly",m:"water",t:"Verify hydrants, hoses, nozzles in place & serviceable; operate all fire pumps for adequate pressure; emergency fire pump fuel supply adequate.",src:"1432 §5.1"},{i:"Monthly",m:"gas",t:"Verify containers/cylinders fitted with pressure gauges read in proper range and installation is free from leakage.",src:"1432 §5.2"},{i:"Monthly",m:"foam",t:"Verify all control & section valves in proper open/closed position and pressure gauges in proper range.",src:"1432 §5.3"},{i:"Monthly",m:"water",t:"Verify control/pump/section valves correct; sprinkler pressure tanks correct water level; test pump auto-start; pressure gauges in range; test sample of section valves for flow & alarm.",src:"1432 §5.4"},{i:"Monthly",m:"ba",t:"Verify firefighter's outfit lockers contain full inventory and equipment is serviceable.",src:"1432 §5.5"},{i:"Monthly",m:"powder",t:"Verify all control & section valves in proper position and pressure gauges in proper range.",src:"1432 §5.6"},{i:"Monthly",m:"aerosol",t:"Verify electrical connections / manual stations properly arranged & in condition; actuation/control panel circuits within manufacturer specs.",src:"1432 §5.7"},{i:"Monthly",m:"portable",t:"Verify all portable foam applicators in place, properly arranged & in proper condition.",src:"1432 §5.8"},{i:"Monthly",m:"portable",t:"Verify all wheeled (mobile) extinguishers in place, properly arranged & in proper condition.",src:"1432 §5.9"},{i:"Monthly",m:"detection",t:"Test a sample of detectors & manual call points so all devices tested within 5 years (sample size for very large systems per Administration).",src:"1432 §5.10"},{i:"Monthly",m:"gas",t:"CO₂: general visual inspection (≥30 days) – stop valves closed, releasing controls correct & accessible, piping/tubing intact, HP cylinders secured, alarm devices in place & undamaged. LP systems: gauge in range, liquid level correct, main service & vapour supply valves secured open.",src:"1318R1 §4"},{i:"Quarterly",m:"water",t:"Verify international shore connection(s) in serviceable condition.",src:"1432 §6.1"},{i:"Quarterly",m:"foam",t:"Verify proper quantity of foam concentrate provided in the foam system storage tank.",src:"1432 §6.2"},{i:"Quarterly",m:"water",t:"Water mist/spray/sprinkler: assess the quality of water in the system (water-quality assessment), to confirm the supply is not degrading pipework or nozzles.",src:"1516 §6.5"},{i:"Quarterly",m:"structural",t:"Test all fire dampers for local operation.",src:"1432 §6.3"},{i:"Quarterly",m:"structural",t:"Test all fire doors in main vertical zone bulkheads for local operation.",src:"1432 §6.4"},{i:"Annual",m:"water",t:"Fire mains/pumps/hydrants/hoses/nozzles: visually inspect components; flow test pumps (emergency pump w/ isolation valves closed); test hydrant valves; pressure-test sample of hoses (all within 5 yrs); verify relief valve settings; examine filters/strainers; verify nozzle size/type.",src:"1432 §7.1"},{i:"Annual",m:"detection",t:"Test all detection systems (incl. those releasing extinguishing systems); visually inspect accessible detectors (all within 1 yr); test emergency power switchover.",src:"1432 §7.2"},{i:"Annual",m:"gas",t:"Fixed gas: inspect components; externally examine HP cylinders for damage/corrosion; check hydrostatic test date of containers; test alarms; verify valve positions; check pilot piping tightness; examine flexible hoses; test fuel shut-offs; inspect space boundaries; verify double release lines integrity if cylinders inside space.",src:"1432 §7.3"},{i:"Annual",m:"foam",t:"Foam: inspect components; test audible alarms; flow test water supply & foam pumps (flush w/ fresh water after); test cross-connections; verify relief valves; examine filters; verify valve positions; blow-through HiEx discharge piping; sample foam concentrates for periodical control tests (Circ.1312 / 670). Test fuel shut-offs.",src:"1432 §7.4"},{i:"Annual",m:"foam",t:"Foam concentrate periodical control: sedimentation, pH, expansion ratio, drainage time, volumic mass (+ small-scale fire test & acetone stability for protein-based AR). First test ≤ 3 yrs after supply (except non-AR foam). Annual thereafter.",src:"1312 §4–5"},{i:"Annual",m:"water",t:"Water mist/spray/sprinkler: verify operation via test valves; inspect components; externally examine HP cylinders; check hydrostatic dates; test alarms; flow test pumps; test antifreeze; test cross-connections; verify relief valves; examine filters; verify valve positions; blow-through dry-pipe discharge; test emergency power switchover; inspect sprinklers in aggressive/damage-prone areas (all within 1 yr).",src:"1432 §7.5 / 1516"},{i:"Annual",m:"water",t:"Automatic sprinkler/water-mist nozzle functional testing per the Circ.1516 flow chart (Basic + Extended testing, RFB-based). For systems ≥5 yrs: test 2 per type in 10 sections (20 total). Conduct water-quality testing in each corresponding piping section.",src:"1516 §3 (7.5.17–.18)"},{i:"Annual",m:"structural",t:"Ventilation & fire dampers: test dampers for remote operation; verify galley exhaust ducts/filters free of grease; test ventilation controls interconnected with fire systems.",src:"1432 §7.6"},{i:"Annual",m:"structural",t:"Test all remotely-controlled fire doors for proper release.",src:"1432 §7.7"},{i:"Annual",m:"ba",t:"Breathing apparatus: check air recharging systems for air quality; check face masks & demand valves serviceable; check EEBDs per maker's instructions.",src:"1432 §7.8"},{i:"Annual",m:"powder",t:"Dry chemical powder: inspect components; verify pressure regulators within calibration; agitate powder charge with (moisture-free) nitrogen per maker.",src:"1432 §7.9"},{i:"Annual",m:"aerosol",t:"Verify aerosol generators have not exceeded mandatory replacement date; demonstrate pneumatic/electric actuators working as far as practicable.",src:"1432 §7.10"},{i:"Annual",m:"portable",t:"Portable foam applicators: verify correct proportioning ratio & condition; verify factory-sealed containers within service life; sealed non-protein concentrate <10 yrs may be accepted without periodical tests; protein-based >5 yrs subject to Circ.1312 tests or renew; non-sealed/undocumented subject to Circ.1312 tests.",src:"1432 §7.11"},{i:"Annual",m:"portable",t:"Wheeled (mobile) extinguishers: periodical inspection per maker; inspect components; check hydrostatic test date of each cylinder; invert dry-powder units to agitate.",src:"1432 §7.12"},{i:"Annual",m:"structural",t:"Check galley & deep-fat cooking fire-extinguishing systems per manufacturer's instructions.",src:"1432 §7.13"},{i:"Annual",m:"portable",t:"Portable extinguishers serviced at intervals not exceeding one year (annual inspection per Table 9.1.3: safety clip, pressure device, external exam, weight, hose/nozzle, operating instructions).",src:"A.951(23) §9.1"},{i:"Annual",m:"gas",t:"CO₂ annual: inspect protected-space boundaries for uncloseable openings; inspect storage containers (corroded/dented/bulging → retest/replace); inspect piping & nozzles; check manifold hoses/fittings tight; entrance doors close & warning signs present; remote releasing controls clear.",src:"1318R1 §5"},{i:"2-Year",m:"gas",t:"Fixed gas: weigh all HP extinguishing-agent & pilot cylinders (or verify contents) – charge must be >95% of nominal; refill below 95%. Blow-through discharge piping to confirm clear.",src:"1432 §8.1"},{i:"2-Year",m:"powder",t:"Dry chemical powder: blow dry nitrogen through discharge piping; operationally test local/remote controls & section valves; verify propellant cylinder contents; sample powder for moisture; pressure-test containment vessel, safety valve & discharge hoses.",src:"1432 §8.2"},{i:"2-Year",m:"water",t:"Water mist/spray/sprinkler with gas or water pressure cylinders: weigh all HP propellant/agent cylinders (or verify contents by reliable means) – charge must be >95% of nominal, refill if below; blow-through discharge piping & nozzles to confirm clear. (Per the §8.1 two-yearly cylinder regime applied to pressurised water-based systems; LR guidance note marks water mist at 2-yearly.)",src:"1432 §8.1 (cyl.)"},{i:"2-Year",m:"gas",t:"CO₂ (passenger – biennial ±3 mo; cargo – intermediate/periodical/renewal): weigh HP & pilot cylinders (charge >90% of nominal, refill below); check LP tank liquid level; check hydrostatic test dates; HP cylinders periodical test ≤ 10 yrs; blow-through discharge piping & nozzles.",src:"1318R1 §6.1"},{i:"2-Year",m:"gas",t:"CO₂ (passenger – biennial; cargo – renewal): test activating heads at full working pressure (or blank/connect pilot lines & test); check manual pull cables/pulleys; clean & adjust cable components; verify pneumatic remote release & pilot gas charge; verify controls/warning devices & time delay; return system to service.",src:"1318R1 §6.2"},{i:"5-Year",m:"gas",t:"Fixed gas: perform internal inspection of all control valves.",src:"1432 §9.1"},{i:"5-Year",m:"foam",t:"Foam: internal inspection of all control valves; flush HiEx piping with fresh water, drain & purge with air; check nozzles clear; test proportioners (mixing ratio within +30/−10% of approval).",src:"1432 §9.2"},{i:"5-Year",m:"water",t:"Water mist/spray/sprinkler: flush all ro-ro deck deluge piping (drain & purge w/ air); internal inspection of control/section valves (+ water-quality testing in corresponding sections per 7.5.18 if not done in last 5 yrs); check/renew batteries.",src:"1432 §9.3 / 1516 §9.3"},{i:"5-Year",m:"ba",t:"Hydrostatic test of all steel SCBA cylinders; aluminium & composite cylinders tested to Administration's satisfaction.",src:"1432 §9.4"},{i:"5-Year",m:"ba",t:"EEBD cylinders: hydrostatic test of EEBD pressure cylinders at the interval specified by the maker / recognized standard (ClassNK references IACS Rec.88).",src:"IACS Rec.88"},{i:"5-Year",m:"lighting",t:"Test luminance of all low-location lighting systems per resolution A.752(18).",src:"1432 §9.5"},{i:"5-Year",m:"portable",t:"Visually examine at least one wheeled extinguisher of each type manufactured in the same year & kept on board.",src:"1432 §9.6"},{i:"5-Year",m:"gas",t:"CO₂: internal inspection of all control valves at least once every five years.",src:"1318R1 §7"},{i:"5-Year",m:"portable",t:"Test-discharge at least one portable extinguisher of each type manufactured in same year, every 5 yrs (as part of a fire drill).",src:"A.951(23) §9.1.1"},{i:"10-Year",m:"gas",t:"Fixed gas: hydrostatic test & internal exam of 10% of agent & pilot cylinders. If 1+ fail → 50% tested; if further fail → all tested. Replace flexible hoses (≤10 yr intervals). Halon: visual + NDT in lieu of hydrostatic if Administration permits.",src:"1432 §10.1"},{i:"10-Year",m:"water",t:"Water mist/spray/sprinkler: hydrostatic test & internal exam of gas & water pressure cylinders per flag guidelines or EN 1968:2002+A1.",src:"1432 §10.2"},{i:"10-Year",m:"powder",t:"Subject all dry-powder containment vessels to hydrostatic or NDT by an accredited service agent.",src:"1432 §10.3"},{i:"10-Year",m:"aerosol",t:"Renew condensed/dispersed aerosol generators per manufacturer's recommendations.",src:"1432 §10.4"},{i:"10-Year",m:"portable",t:"Hydrostatically test all wheeled extinguishers & propellant cartridges by specially trained persons per recognized standards / maker.",src:"1432 §10.5"},{i:"10-Year",m:"gas",t:"CO₂ HP cylinders: 10-yr periodical test – 10% internal inspection & hydrostatic test; if 1+ fail → 50%; if further fail → all. Before 20-yr anniversary & every 10 yrs thereafter: ALL cylinders hydrostatic test. Flexible hoses ≤ 10 yrs.",src:"1318R1 §6.1.2"},{i:"10-Year",m:"portable",t:"Hydraulically test all portable extinguishers & propellant cartridges per recognized standard / maker (≤ 10 yr intervals).",src:"A.951(23) §9.1.2"}],FLAGS=[{id:"imo",name:"IMO baseline",circ:"MSC.1/Circ.1432 as amended + 1516, 1318/Rev.1, A.951(23)",notes:[]},{id:"antigua",name:"Antigua & Barbuda",circ:"Antigua & Barbuda Circular 2012-011 (25 Jan 2024)",notes:[]},{id:"australia",name:"Australia",circ:"Australia Marine Order 15 (21 May 2014)",notes:[]},{id:"bahamas",name:"Bahamas",circ:"BMA Marine Notice MN079 v2.2 (20 Dec 2025); MN080 sprinklers; MN081 EEBDs",notes:[{m:"gas",txt:"CO₂: at 10-yr, test 10%; if fail, all tested. Further 10% at the 20th anniversary regime; before 20-yr & every 10 yrs thereafter all cylinders hydrostatic tested.",interval:"10-Year"},{m:"ba",txt:"Breathing apparatus: 5-year hydrostatic test on bottles.",interval:"5-Year"},{m:"portable",txt:"Additional extinguishers of same type & capacity shall be carried in lieu of spare charges where recharge on board is not possible.",interval:"Annual"},{m:"foam",txt:"PFOS/PFAS foam prohibition not later than first survey on/after 1 Jan 2026.",interval:"Annual"}]},{id:"bahrain",name:"Bahrain",circ:"Bahrain Directive No. SOLAS/12 (29 Dec 2016)",notes:[]},{id:"barbados",name:"Barbados",circ:"Barbados Bulletin 012 (20 Aug 2025)",notes:[]},{id:"bermuda",name:"Bermuda",circ:"Bermuda Shipping Notice 2024-021 / 2024-027 / 2021-028 / 2019-06",notes:[]},{id:"cayman",name:"Cayman Islands",circ:"Cayman Islands Shipping Notice 01/2014 Rev.2 (6 Oct 2022)",notes:[]},{id:"cookislands",name:"Cook Islands",circ:"Cook Islands Circular 55/2013 (10 Apr 2015)",notes:[]},{id:"cyprus",name:"Cyprus",circ:"Circular No. 41/2021 (9 Dec 2021)",notes:[{m:"gas",txt:"Adopts revised CO₂ hydrostatic-test regime and introduces 5-yearly internal inspection of control valves.",interval:"5-Year"},{m:"all",txt:"Survey window of ± three months from the Cargo Ship Safety anniversary date.",interval:null},{m:"ba",txt:"Irrespective of number of EEBDs in place, at least one additional EEBD should be provided.",interval:"Annual"}]},{id:"dominica",name:"Dominica",circ:"Dominica CD-MSC 33-01 Rev.01 (18 Apr 2008)",notes:[]},{id:"gibraltar",name:"Gibraltar",circ:"Gibraltar Shipping Guidance Notice 046 / SGN 115(a) (8 Jun 2023)",notes:[]},{id:"hongkong",name:"Hong Kong",circ:"Hong Kong Merchant Shipping Information Note No. 14/2016 (18 Jan 2016)",notes:[]},{id:"isleofman",name:"Isle of Man",circ:"Isle of Man Ship Registry Manx Shipping Notice MSN 057 (May 2025)",notes:[]},{id:"japan",name:"Japan",circ:"NK Rules Part R 14.2.2 (to be based on MSC.1/Circ.1432 & 1516)",notes:[]},{id:"kiribati",name:"Kiribati",circ:"Kiribati Marine Circular 16/2012 Rev.2 (2 Dec 2019)",notes:[]},{id:"liberia",name:"Liberia",circ:"Marine Notice FIR-001 Rev.01/26 (23 Jan 2026)",notes:[{m:"gas",txt:"CO₂ internal inspection & hydrostatic test referenced to the cylinder's 10-year anniversary date of the last test.",interval:"10-Year"},{m:"foam",txt:"PFOS-containing extinguishing media prohibited – phase out not later than the first survey on/after 1 Jan (PFAS transition); confirm foam concentrate compliance.",interval:"Annual"}]},{id:"luxembourg",name:"Luxembourg",circ:"Luxembourg CAM 01/2022 (5 Apr 2022)",notes:[]},{id:"malaysia",name:"Malaysia",circ:"MSN 05/2023 (22 Mar 2023)",notes:[]},{id:"malta",name:"Malta",circ:"Technical Notice SLS6 Rev.4 (5 Feb 2025)",notes:[{m:"portable",txt:"For extinguishers that cannot be recharged on board, additional extinguishers of the same type & capacity to be carried.",interval:"Annual"},{m:"gas",txt:"Standard hydrostatic pressure test regime applied per IMO baseline.",interval:"10-Year"}]},{id:"marshall",name:"Marshall Islands",circ:"Marine Notice 2-011-14 Rev. Aug/2025 (27 Aug 2025)",notes:[{m:"ba",txt:"Dedicated guidance on hydrostatic testing of SCBA cylinders (see MG §10.4).",interval:"5-Year"},{m:"foam",txt:"Foam containing PFAS: ships constructed before 1 Jan 2026 to comply not later than the date of the first survey thereafter.",interval:"Annual"}]},{id:"myanmar",name:"Myanmar",circ:"Directive 5/2016 (21 Nov 2016); SS3656 for portable extinguishers",notes:[]},{id:"netherlands",name:"Netherlands",circ:"Netherlands ItoS – SOLAS Chapter II-2 Ver.8 (2 Jun 2023)",notes:[]},{id:"oman",name:"Oman",circ:"Oman Circular B09 / B10",notes:[]},{id:"panama",name:"Panama",circ:"Merchant Marine Circular MMC-281 V.04 (Jul 2022); MMC-142 EEBDs (Nov 2023)",notes:[{m:"all",txt:"Where the RO determines equipment does not comply, request SEGUMAR authorization for a Conditional Statutory Certificate (conditionals@segumar.com) per MMC-156.",interval:null},{m:"foam",txt:"Circ.1312 (foam) applied as recommendation only; additional referenced circulars include MSC.1/Circ.798 (medium-exp.) & 670 (high-exp.) foam.",interval:"Annual"}]},{id:"saudi",name:"Saudi Arabia",circ:"Saudi Arabia Shipping Notice 02/2020 (Feb 2020)",notes:[]},{id:"singapore",name:"Singapore",circ:"MPA Shipping Circular No. 13 of 2021",notes:[{m:"gas",txt:"CO₂ HP cylinders: from 1 Jan 2022 hydrostatic test of ALL cylinders at/before 20th & 30th anniversary, then every 10 yrs. Transitional regimes apply to ships that completed 20th/30th-anniversary maintenance under the old Circular No.19/2013.",interval:"10-Year"},{m:"gas",txt:"Whenever CO₂ cylinders are removed for hydrostatic test they shall be replaced to maintain FSS Code Ch.5 §2.2.1 quantity (exception during dry-docking).",interval:"10-Year"}]},{id:"svg",name:"St. Vincent & the Grenadines",circ:"St. Vincent & the Grenadines Circular No. SOL 006 Rev.11",notes:[]},{id:"switzerland",name:"Switzerland",circ:"Circular No. CH50 (SMNO, 1 Nov 2016)",notes:[]},{id:"tuvalu",name:"Tuvalu",circ:"Tuvalu Marine Circular MC-7/2011/1 (Jun 2018) / MC-17/2011/1 (Apr 2018)",notes:[]},{id:"uk",name:"United Kingdom",circ:"UK MCA Marine Guidance Notes MGN 258 / 276 / 355 / 374; MSIS 12",notes:[]},{id:"usa",name:"United States",circ:"US CFRs (mandatory); MSC.1/Circ.1432 as minimum guideline",notes:[{m:"all",txt:"US-flag: the Code of Federal Regulations (CFRs) are mandatory and take precedence; MSC.1/Circ.1432 is treated only as a minimum-level guideline.",interval:null}]},{id:"vanuatu",name:"Vanuatu",circ:"Vanuatu Fleet/Safety Letter (25 May 2016)",notes:[]},{id:"vietnam",name:"Vietnam",circ:"Vietnam Technical Information 023TI.E/12TB (20 Jul 2012)",notes:[]}],SOURCE_DOCS=[{ref:"1432",full:"MSC.1/Circ.1432 — Revised guidelines for maintenance & inspection of fire protection systems and appliances (31 May 2012)",link:"https://www.classnk.or.jp/hp/pdf/activities/statutory/solas/solas_treaty/fire_protection/imo_circular/ci_1432_e.pdf"},{ref:"1516",full:"MSC.1/Circ.1516 — Amendments to MSC.1/Circ.1432 (8 Jun 2015)",link:"https://maritime.lr.org/l/941163/2022-01-25/2vhym/941163/1643104451v6zvMWiI/MSC.1_CIRC.1516.pdf"},{ref:"1318R1",full:"MSC.1/Circ.1318/Rev.1 — Maintenance & inspection of fixed CO₂ fire-extinguishing systems (25 May 2021)",link:"https://www.classnk.or.jp/hp/pdf/activities/statutory/solas/solas_treaty/fire_protection/imo_circular/ci_1318_rev.1.pdf"},{ref:"1312",full:"MSC.1/Circ.1312 — Performance, testing & survey of foam concentrates (10 Jun 2009)",link:"https://www.classnk.or.jp/hp/pdf/activities/statutory/solas/solas_treaty/fire_protection/imo_circular/ci_1312.pdf"},{ref:"A.951(23)",full:"Resolution A.951(23) — Improved guidelines for marine portable fire extinguishers",link:"https://www.classnk.or.jp/hp/pdf/activities/statutory/solas/solas_treaty/fire_protection/imo_circular/ci_951.pdf"}];function srcUrl(e){if(!e)return null;const t={};return SOURCE_DOCS.forEach(e=>{e.link&&(t[e.ref]=e.link)}),/^A\.951\(23\)/.test(e)?t["A.951(23)"]||null:/^1318R1/.test(e)?t["1318R1"]||null:/^1516/.test(e)?t[1516]||null:/^1312/.test(e)?t[1312]||null:/^1432/.test(e)?t[1432]||null:/^IACS Rec\.?88/i.test(e)?"https://iacs.org.uk/resolutions/recommendations/81-100/rec-88-rev1-cln":null}const SAFETY_ADVISORIES=[{id:"pfos",status:"active",date:"01/01/2026",kind:"regulation",title:"PFOS prohibited in fire-extinguishing media",media:["foam","portable"],effective:"01/01/2026",summary:"IMO amendments to SOLAS Ch. II-2 (reg. 10.11) and the 1994/2000 HSC Codes prohibit the use or storage of fire-extinguishing media — including firefighting foams — containing perfluorooctane sulfonic acid (PFOS).",points:["Adopted by resolutions MSC.532(107) (SOLAS II-2), MSC.536(107) (1994 HSC Code) and MSC.537(107) (2000 HSC Code); in force 1 January 2026.","Applies to both fixed systems and portable firefighting equipment.","Concentration limit: 10 mg/kg (0.001% by weight), per unified interpretation MSC.1/Circ.1694.","New ships (built on/after 01/01/2026): compliant on delivery. Existing ships: comply no later than the first survey on/after 01/01/2026.","Removed PFOS media must go to appropriate shore-based reception facilities. Verify foam via maker's declaration or laboratory test; replacement media must be certified PFOS-free.","Note: the IMO ban targets PFOS specifically, not all PFAS. Draining and refilling may be insufficient — PFAS residues can adhere to system internals and re-contaminate new foam."],refs:"SOLAS II-2/10.11 (MSC.532(107)); HSC Codes (MSC.536(107), MSC.537(107)); MSC.1/Circ.1694",link:"https://www.lr.org/en/knowledge/class-news/16-25/"},{id:"roro-fire-2026",status:"active",date:"01/04/2026",kind:"regulation",title:"Fire safety amendments for Ro-Ro, passenger & cargo ships",media:["detection","water","structural"],effective:"01/01/2026",summary:"IMO resolutions MSC.550(108) and MSC.555(108) amend SOLAS Ch. II-2 (regs 7 & 20) and the FSS Code (Chs 7 & 9), strengthening fire detection/alarm, water-based suppression, and containment in vehicle, special category and Ro-Ro spaces. Driven by Ro-Ro/vehicle-carrier fire incidents and the EMSA FIRESAFE I/II studies.",points:["Entry into force 1 January 2026. New ships: built on/after that date. Existing ships: comply no later than the first survey on/after 1 January 2028 (per MSC.1/Circ.1290 'first survey').","Detection & alarm: individually identifiable fixed detection in vehicle/special-category/Ro-Ro spaces; combined smoke & heat detectors; detection aligned with deluge-system sections; weather decks for vehicles need fixed detection with approved detector types/spacing.","Video monitoring: effective continuous video monitoring of vehicle/special-category/Ro-Ro spaces with replay (≥7 days new ships; ≥24 hours for older passenger ships) at a manned control station/safety centre.","Water-based suppression: weather decks for vehicle carriage to be covered by fixed monitor system(s) per FSS Code Ch.7 — combined ≥2.0 L/min/m², each monitor ≥1,250 L/min, with drainage sized to remove ≥125% of combined monitor + hose-nozzle capacity.","Structural protection (passenger ships >36 pax): special-category/Ro-Ro boundary bulkheads & decks insulated to A-60 (reducible to A-0 in defined cases); controlled arrangement of openings with safety distances; steel ramps/doors.","FSS Code Ch.9: linear heat detectors (tested to EN 54-22:2015 / IEC 60092-504), detector spacing tables, and consistent alarm presentation; smoke detection may be disabled during vehicle loading/unloading (heat detection & call points may not)."],refs:"SOLAS II-2/20 (MSC.550(108)); FSS Code Ch.7 & 9 (MSC.555(108)); MSC.1/Circ.1695 (UI of the FSS Code, detector spacing). Summarised from LR Class News 07/2026 (1 Apr 2026).",link:"https://www.lr.org/en/knowledge/class-news/07-26/"},{id:"ondeck-container-fire",status:"active",date:"03/02/2015",kind:"regulation",title:"On-deck container fire protection — water mist lance & mobile monitors",media:["water","portable"],effective:"01/01/2016",summary:"IMO amendments to SOLAS regulation II-2/10 introduced fire-protection requirements for on-deck cargo areas of new ships designed to carry containers on or above the weather deck, in response to industry concerns about tackling fires in deck-stowed containers (limited access and, historically, only manual intervention with extinguishers and hoses).",points:["Applies to ships designed to carry containers on or above the weather deck, constructed on or after 1 January 2016.","At least one water mist lance shall be fitted, in addition to all other required fire-protection arrangements.","Ships designed to carry five or more tiers of containers on/above the weather deck shall also be provided with mobile water monitors.","Mobile water monitor count by beam: breadth up to 30 m — at least two; breadth exceeding 30 m — at least four."],refs:"SOLAS regulation II-2/10 (on-deck cargo areas). Summarised from LR Class News 02/2015 (3 Feb 2015).",link:"https://www.lr.org/en/knowledge/class-news/02-15/"},{id:"co2-release",status:"active",date:"01/01/2018",kind:"safety",title:"Unintended CO₂ release — maintenance of fixed CO₂ systems",media:["gas"],effective:null,summary:"MAIB Report 16/2018 (ro-ro vessels Eddystone & Red Eagle) investigated unintentional CO₂ releases and found fire-system maintenance and the available industry guidance to be inadequate. Historically, unintended CO₂ release has caused many casualties in the marine sector.",points:["Both incidents: gas leaked into the CO₂ cylinder compartment but was held back from the engine room by a closed main distribution valve — the safety margin was narrow.","Safety lessons: maintenance of the fire-extinguishing systems was inadequate; available guidance on CO₂ system maintenance/inspection was insufficient.","MAIB asked the MCA to ensure all CO₂-system safety devices are maintained/surveyed appropriately and to seek IMO clarification on the maximum periodicity between hydrostatic tests of individual HP cylinders (MSC.1/Circ.1318).","MAIB recommended LR & DNV-GL raise with IACS the quality of service from approved service suppliers maintaining CO₂ systems.","Design lesson: review systems where leakage of a single cylinder valve can discharge the entire bank."],refs:"MAIB Accident Investigation Report 16/2018; relates to MSC.1/Circ.1318/Rev.1; MCA Safety Bulletin No. 12",link:"https://www.gov.uk/maib-reports/unintentional-release-of-carbon-dioxide-from-fixed-fire-extinguishing-systems-on-ro-ro-vessels-eddystone-and-red-eagle"},{id:"co2-level-indicator",status:"active",date:"01/01/2025",kind:"recommendation",title:"CO₂ cylinder content check by level indicator — temperature limit",media:["gas"],effective:null,summary:"Highly recommended practice: measuring CO₂ cylinder contents with a level indicator at high ambient temperatures is technically unreliable. CO₂ is stored mainly as a liquid under pressure, and level measurement depends on a stable liquid–vapour equilibrium that breaks down as temperature rises.",points:["CO₂'s critical temperature is ~31°C; above this point CO₂ cannot exist as a distinct liquid phase, so level-based measurement becomes unreliable. Even well below the critical point, elevated ambient temperatures affect internal pressure and measurement precision.","Recommendation: use level-indicator methods only when the cylinder temperature is below 25°C, to ensure sufficient accuracy and reliability.","Level-indicator checks should use properly calibrated equipment with valid calibration certification.","Where temperature conditions are unsuitable (e.g. typical ambient temperatures in Thailand often exceed this threshold), use a more appropriate method such as weighing to obtain reliable, accurate results."],refs:"Technical best-practice recommendation; basis: CO₂ content verification under MSC.1/Circ.1318/Rev.1 §6.1 (‘weighed or contents verified by other reliable means’)"},{id:"psc-fire-cic-2023",status:"historical",date:"29/08/2023",kind:"safety",title:"Port State Control — Fire Safety Concentrated Inspection Campaign",media:["detection","water","foam","gas","powder","portable","ba","structural"],effective:null,summary:"A joint Port State Control Concentrated Inspection Campaign (CIC) on fire safety was run by the Paris and Tokyo MoU member authorities from 1 September to 30 November 2023, with the Black Sea MoU and Acuerdo Viña del Mar authorities running parallel campaigns. It indicates the fire-safety areas PSC focuses on during inspections.",points:["Conducted as an additional part of regular PSC inspections (one CIC inspection per ship during the campaign period).","Verifies that firefighting systems and equipment comply with requirements and are properly maintained and in operational condition.","Checks that masters and crews are familiar with fire-safety procedures.","Deficiencies may require immediate rectification or rectification within a set period, and can result in detention of the ship.","Although the 2023 campaign has concluded, it remains a useful checklist of what PSC scrutinises on fire safety; LR & UK P&I Club's free PSC Pocket Checklists app supports preparation."],refs:"Paris & Tokyo MoU PSC Concentrated Inspection Campaign on Fire Safety (1 Sep – 30 Nov 2023). Source: LR Class News 16/2023 (29 Aug 2023).",link:"https://www.lr.org/en/knowledge/class-news/16-23/"},{id:"cn-06-13",status:"active",date:"01/01/2013",kind:"regulation",title:"Revised IMO guidelines for maintenance & inspection of fire protection systems",media:["detection","water","foam","gas","powder","portable","ba","structural"],effective:null,summary:"IMO issued revised guidelines for the maintenance and inspection of fire-protection systems and appliances (MSC.1/Circ.1432), consolidating periodic testing requirements. These guidelines are the principal basis for the maintenance intervals in this reference tool.",points:["Sets out recommended weekly/monthly/quarterly/annual and multi-year maintenance, testing and inspection actions for fire-protection systems.","Later amended by MSC.1/Circ.1516 (in-service testing of water-based systems)."],refs:"MSC.1/Circ.1432. Source: LR Class News 06/2013.",link:"https://www.lr.org/en/knowledge/class-news/06-13/"},{id:"cn-18-14",status:"active",date:"01/07/2014",kind:"regulation",title:"2014 amendments to SOLAS and the FSS Code",media:["detection","water","foam","gas","structural"],effective:"01/07/2014",summary:"A package of 2014 amendments to SOLAS Chapter II-2 and the Fire Safety Systems (FSS) Code entered into force on 1 July 2014, refining fire-safety construction, systems and equipment requirements.",points:["Affects fire detection, fixed extinguishing systems and structural fire protection across the SOLAS/FSS framework.","Consult the consolidated SOLAS/FSS Code text for the specific regulation changes applicable to a given ship."],refs:"2014 SOLAS & FSS Code amendments (in force 01/07/2014). Source: LR Class News 18/2014.",link:"https://www.lr.org/en/knowledge/class-news/18-14/"},{id:"cn-43-16",status:"active",date:"01/01/2016",kind:"regulation",title:"Fire-fighting medium weights in lightweight / lightship condition",media:["gas","powder","foam","water"],effective:null,summary:"Statutory alert clarifying that the weight of fixed fire-fighting mediums (CO₂, dry chemical powder, foam concentrate, fresh water, etc.) should be included as part of the lightweight and lightship condition used for stability.",points:["The charge of fixed-system mediums is part of the ship's lightship weight and should be accounted for in the stability information.","Relevant when systems are recharged, converted, or media type/quantity changes."],refs:"Statutory alert on lightweight/lightship inclusion of fire-fighting media. Source: LR Class News 43/2016.",link:"https://www.lr.org/en/knowledge/class-news/43-16/"},{id:"cn-20-16",status:"active",date:"01/01/2016",kind:"regulation",title:"Revised guidelines for in-service testing of sprinkler & water mist systems",media:["water"],effective:null,summary:"IMO issued revised guidelines for the in-service testing of automatic sprinkler and automatic water mist systems (MSC.1/Circ.1516, amending MSC.1/Circ.1432), adding quarterly water-quality and section-testing expectations.",points:["Introduces in-service testing for water-based systems including water-quality checks and section function tests.","Applies alongside MSC.1/Circ.1432 maintenance schedules."],refs:"MSC.1/Circ.1516. Source: LR Class News 20/2016.",link:"https://www.lr.org/en/knowledge/class-news/20-16/"},{id:"cn-39-17",status:"active",date:"01/01/2017",kind:"regulation",title:"Bahamas — early implementation of SOLAS II-2/1 & 10 amendments",media:["portable","foam"],effective:null,summary:"Statutory alert: IMO resolution MSC.409(97) amended SOLAS Chapter II-2 to waive the requirement for a 135-litre foam-type wheeled fire extinguisher in machinery spaces in defined cases. The Bahamas Maritime Authority permitted early implementation.",points:["MSC.409(97) removes the mandatory 135-litre foam wheeled extinguisher in certain machinery-space configurations.","Bahamas-flag ships could apply the relief ahead of the general entry-into-force date."],refs:"SOLAS II-2/1 & II-2/10 (MSC.409(97)); Bahamas Maritime Authority early implementation. Source: LR Class News 39/2017.",link:"https://www.lr.org/en/knowledge/class-news/39-17/"},{id:"cn-24-18",status:"historical",date:"01/01/2018",kind:"safety",title:"PSC CIC — Emergency Systems & Procedures (escape routes & markings)",media:["structural","lighting"],effective:null,summary:"A Port State Control Concentrated Inspection Campaign on Emergency Systems and Procedures was run concurrently by the Riyadh, Indian Ocean and Abuja MoUs, with a focus that included escape routes and the location markings of safety equipment.",points:["PSC checks covered escape-route arrangements, low-location lighting/markings, and crew familiarity with emergency procedures.","Although the campaign period has passed, it indicates recurring PSC focus areas for emergency systems."],refs:"Riyadh / Indian Ocean / Abuja MoU PSC CIC on Emergency Systems & Procedures. Source: LR Class News 24/2018.",link:"https://www.lr.org/en/knowledge/class-news/24-18/"},{id:"cn-29-14",status:"historical",date:"01/09/2014",kind:"safety",title:"Caribbean MoU — Port State Control inspection campaign (2014)",media:["detection","water","foam","gas","portable","ba"],effective:null,summary:"The Caribbean Memorandum of Understanding on Port State Control launched its second Concentrated Inspection Campaign from 1 September 2014, verifying compliance and operational readiness of ship safety systems.",points:["Indicates the kinds of safety-system checks Caribbean MoU PSC officers prioritise.","Historical campaign, retained for reference."],refs:"Caribbean MoU PSC Concentrated Inspection Campaign (from 01/09/2014). Source: LR Class News 29/2014.",link:"https://www.lr.org/en/knowledge/class-news/29-14/"},{id:"cn-03-18",status:"active",date:"01/01/2018",kind:"safety",title:"Kidde safety bulletin — cylinder replacement (HFC227 / Novec 1230)",media:["gas"],effective:null,summary:"Kidde Fire Protection issued a safety bulletin requiring hardware replacement of certain cylinders used in HFC227ea and Novec 1230 clean-agent fire-extinguishing systems.",points:["Affected cylinders require hardware replacement per the manufacturer's bulletin.","Check whether installed clean-agent system cylinders fall within the affected batches and arrange remediation with an approved service supplier."],refs:"Kidde Fire Protection safety bulletin (clean-agent system cylinders). Source: LR Class News 03/2018.",link:"https://www.lr.org/en/knowledge/class-news/03-18/"},{id:"cn-04-18",status:"active",date:"01/01/2018",kind:"safety",title:"Cosmo Co. fire doors — quality defect notice",media:["structural"],effective:null,summary:"Cosmo Co. Ltd issued an updated Notice Letter and Root Cause Analysis covering a quality issue discovered in a number of their manufactured fire doors.",points:["A manufacturing quality defect was identified in affected fire doors.","Verify whether installed fire doors are within the affected production and follow the maker's remediation guidance."],refs:"Cosmo Co. Ltd fire-door Notice Letter & Root Cause Analysis. Source: LR Class News 04/2018.",link:"https://www.lr.org/en/knowledge/class-news/04-18/"},{id:"cn-19-23",status:"active",date:"01/01/2023",kind:"safety",title:"Safety notice — NK Co. Ltd CO₂ system cylinders",media:["gas"],effective:null,summary:"A safety notice was issued concerning CO₂ fire-extinguishing system cylinders manufactured by NK Co. Ltd.",points:["Affected CO₂ cylinders are the subject of a manufacturer/authority safety notice.","Check installed CO₂ system cylinders against the affected manufacturer details and follow the notice's instructions."],refs:"Safety notice for NK Co. Ltd CO₂ system cylinders. Source: LR Class News 19/2023.",link:"https://www.lr.org/en/knowledge/class-news/19-23/"},{id:"cn-23-23",status:"active",date:"01/01/2023",kind:"safety",title:"Safety recall — AWG fire hose nozzles",media:["water","portable"],effective:null,summary:"The EU Commission's Safety Gate rapid alert system issued Alert A12/01695/23 for defective AWG fire hose nozzles.",points:["Defective fire hose nozzles are subject to an EU Safety Gate recall.","Check fire hose nozzle inventory against the recall and replace affected units."],refs:"EU Safety Gate Alert A12/01695/23 (AWG fire hose nozzles). Source: LR Class News 23/2023.",link:"https://www.lr.org/en/knowledge/class-news/23-23/"},{id:"cn-14-14",status:"active",date:"01/01/2014",kind:"safety",title:"USCG — operational readiness of local application water spray systems",media:["water"],effective:null,summary:"The U.S. Coast Guard issued a safety bulletin highlighting deficiencies in the operational readiness of local application fire-fighting (water spray) systems protecting machinery-space hazards.",points:["Local application water spray systems were found not fully operational during inspections.","Confirm nozzles, sections and release arrangements are tested and ready per the maintenance schedule."],refs:"USCG safety bulletin (local application water spray systems). Source: LR Class News 14/2014.",link:"https://www.lr.org/en/knowledge/class-news/14-14/"},{id:"cn-03-15",status:"active",date:"01/01/2015",kind:"safety",title:"USCG detentions — water mist system deficiencies (update)",media:["water"],effective:null,summary:"The U.S. Coast Guard reported having detained over 40 foreign-flag vessels for water mist system deficiencies, underlining the need for proper maintenance and testing of these systems.",points:["Common issues relate to maintenance, testing and operational readiness of water mist systems.","Ensure water mist systems are maintained and tested per MSC.1/Circ.1432 / 1516 and the maker's instructions."],refs:"USCG PSC detentions for water mist deficiencies. Source: LR Class News 03/2015.",link:"https://www.lr.org/en/knowledge/class-news/03-15/"},{id:"cn-35-13",status:"active",date:"01/01/2013",kind:"safety",title:"USCG detentions — inoperative water mist systems",media:["water"],effective:null,summary:"The U.S. Coast Guard issued several Port State Control detentions for inoperative water mist systems, an early warning that became a sustained enforcement focus.",points:["Water mist systems found inoperative led to PSC detentions.","Maintain and function-test water mist systems and keep records available for inspection."],refs:"USCG PSC detentions for inoperative water mist systems. Source: LR Class News 35/2013.",link:"https://www.lr.org/en/knowledge/class-news/35-13/"},{id:"cn-11-23",status:"active",date:"01/01/2023",kind:"safety",title:"Engine-room safety — pipe compression fittings & fire prevention",media:["structural"],effective:null,summary:"Engine-room safety alert addressing the role of pipe compression fittings in oil leaks and machinery-space fire prevention.",points:["Compression fittings on oil/fuel lines can loosen or fail, creating spray-fire risk on hot surfaces.","Inspect, correctly install and maintain pipe fittings, and ensure hot-surface shielding and insulation are intact."],refs:"Engine-room safety — pipe compression fittings & fire prevention. Source: LR Class News 11/2023.",link:"https://www.lr.org/en/knowledge/class-news/11-23/"},{id:"cn-06-25",status:"active",date:"01/01/2025",kind:"regulation",title:"Engine-room means of escape arrangements",media:["structural","lighting"],effective:null,summary:"Class News addressing engine-room means of escape arrangements — the provision, arrangement and protection of escape routes from machinery spaces.",points:["Concerns the number, arrangement and protection of escape routes from machinery spaces under SOLAS II-2.","Refer to the Class News and applicable SOLAS II-2 regulations for the detailed arrangement requirements."],refs:"Engine-room means of escape arrangements. Source: LR Class News 06/2025.",link:"https://www.lr.org/en/knowledge/class-news/06-25/"},{id:"cn-19-19",status:"active",date:"01/01/2019",kind:"safety",title:"Mitigating lithium battery system fires",media:["detection","water"],effective:null,summary:"The Norwegian Maritime Authority alerted shipowners and operators to the hazards of lithium battery systems, including thermal runaway and the challenges of detecting and extinguishing battery fires.",points:["Lithium battery fires can self-sustain (thermal runaway) and re-ignite, challenging conventional fixed systems.","Consider detection, ventilation, containment and dedicated fire-fighting/cooling arrangements for battery spaces."],refs:"Norwegian Maritime Authority alert on lithium battery system fires. Source: LR Class News 19/2019.",link:"https://www.lr.org/en/knowledge/class-news/19-19/"},{id:"cn-19-15",status:"active",date:"01/01/2015",kind:"regulation",title:"Norway NMA Reg. 227 — fire & explosion on mobile offshore units",media:["detection","water","foam","gas","structural"],effective:null,summary:"The Norwegian Maritime Authority updated Regulation No. 227 on precautionary measures against fire and explosion on mobile offshore units (MOUs).",points:["Applies to mobile offshore units under Norwegian requirements.","Covers fire/explosion prevention, detection and protection measures specific to MOUs."],refs:"Norwegian Maritime Authority Regulation No. 227 (fire & explosion, MOUs). Source: LR Class News 19/2015.",link:"https://www.lr.org/en/knowledge/class-news/19-15/"},{id:"cn-15-19",status:"active",date:"01/01/2019",kind:"regulation",title:"China — control & monitoring of service suppliers",media:["portable","foam","gas","water","detection","ba"],effective:null,summary:"New regulations came into force in China for the control and monitoring of service suppliers — including firefighting equipment servicing (alongside life-saving appliances, navigation/radio equipment, thickness measurement/NDT and other IMO-required servicing).",points:["Firefighting-equipment service suppliers operating in China are subject to control and monitoring requirements.","Verify the approval status of service suppliers used for fire-protection servicing in China."],refs:"China service-supplier control & monitoring requirements. Source: LR Class News 15/2019.",link:"https://www.lr.org/en/knowledge/class-news/15-19/"},{id:"cn-01-20",status:"active",date:"01/01/2020",kind:"regulation",title:"China — service supplier requirements (update)",media:["portable","foam","gas","water","detection","ba"],effective:null,summary:"An update to the new requirements for the control and monitoring of service suppliers in China, following the earlier 2019 alert.",points:["Refines the China service-supplier control/monitoring framework introduced in 2019.","Confirm current approval requirements for fire-protection service suppliers in China before arranging servicing."],refs:"Update to China service-supplier requirements. Source: LR Class News 01/2020.",link:"https://www.lr.org/en/knowledge/class-news/01-20/"},{id:"cn-26-15",status:"active",date:"01/01/2016",kind:"regulation",title:"Means of escape from machinery spaces — SOLAS II-2/13.4",media:["structural"],effective:"01/01/2016",summary:"IMO amended SOLAS Regulation II-2/13.4 to improve means of escape from machinery spaces on cargo ships, aligning them with existing passenger-ship arrangements. Applies to all new passenger and cargo ships constructed (keel laid) on or after 1 January 2016.",points:["Two means of escape required from a machinery control room (new passenger and cargo ships).","Two means of escape required from main workshops within the machinery space, with at least one route providing a continuous fire shelter to a safe position outside the machinery space.","Inclined ladders/stairways with open treads in machinery spaces that form part of or give access to escape routes (and are not within a protected enclosure) must have steel shields fitted to their undersides.","Terms ‘main workshop’, ‘machinery control room’, ‘continuous fire shelter’ and ‘safe position’ are clarified in the unified interpretation MSC.1/Circ.1511."],refs:"SOLAS II-2/13.4 (IMO Resolution MSC.365(93)); UI in MSC.1/Circ.1511. Source: LR Class News 26/2015.",link:"https://www.lr.org/en/knowledge/class-news/26-15/"},{id:"dnv-co2-deficiencies",status:"active",date:"23/10/2025",kind:"safety",title:"Deficiencies in CO₂ fire-extinguishing systems — depleted cylinders",media:["gas"],effective:null,summary:"DNV identified cases where CO₂ fire-extinguishing systems had multiple depleted CO₂ cylinders, potentially compromising fire safety and vessel integrity. Two primary contributors were found: incorrect use of ultrasonic level gauges, and a bursting-disc material issue.",points:["Ultrasonic level gauging above the maker's maximum cylinder temperature gives unreliable readings: at elevated temperatures CO₂ becomes a supercritical fluid with no liquid level to measure.","Bursting-disc material: copper bursting discs in the cylinder valve are prone to fatigue failure — to date observed only in systems supplied by NK Co., Ltd. (South Korea) up to 2016. See Marshall Islands Maritime Safety Advisory No. 14-23.","Keep the latest CO₂ user manual on board and follow it.","Use approved service suppliers and stay within the applicable regulatory intervals.","Use ultrasonic level gauges only within the manufacturer's specified temperature range for the liquid-level test of CO₂ cylinders."],refs:"DNV Technical & Regulatory News (23 Oct 2025); Marshall Islands Maritime Safety Advisory No. 14-23.",link:"https://www.dnv.com/news/2025/deficiencies-in-co2-fire-extinguishing-systems/"},{id:"dnv-pfos-documentation",status:"active",date:"04/05/2026",kind:"regulation",title:"Documenting PFOS-free fire-extinguishing foam on board",media:["foam","portable"],effective:"01/01/2026",summary:"At the first safety-equipment survey after 1 January 2026, all fire-extinguishing foams on board (fixed systems and portable equipment) must be PFOS-free, verified by the attending surveyor. This is the practical companion to the PFOS prohibition: how to document compliance and avoid part-held surveys or Conditions of Authority.",points:["Applies to all foam on board — both fixed systems and portable equipment.","Three ways to document PFOS-free foam: (1) a manufacturer's PFOS-free declaration; (2) an accredited-laboratory test report confirming PFOS below 10 mg/kg (0.001% by weight) to a recognised standard; or (3) a Type Approval / MED certificate stating PFOS-free (treated as equivalent to a declaration).","If none can be provided, the foam must be replaced with PFOS-free foam and documented per (1), (2) or (3).","Documentation must be traceable to the actual foam on board — manufacturer, foam type, production date / batch number, and relevant TA/MED references; on-board marking must support that traceability.","‘First survey’ = first annual, periodical or renewal survey for the Cargo Ship Safety Equipment, Cargo Ship Safety, Passenger Ship Safety, or HSC Safety Certificate. Prepare documentation early."],refs:"DNV Technical & Regulatory News (4 May 2026); follow-up to DNV News No. 37 (Nov 2025) on the PFOS prohibition. Basis: SOLAS II-2/10.11.",link:"https://www.dnv.com/news/2026/how-to-document-pfos-free-fire-extinguishing-foam-on-board/"},{id:"tec-1318",status:"active",date:"26/02/2024",kind:"regulation",title:"Fire-extinguishing arrangement for paint & flammable-liquid lockers — Marshall Islands",media:["portable","gas","powder","water"],effective:null,summary:"Marshall Islands special requirements (Marine Notice 2-011-6 Rev. 2023) for fire extinguishing of paint and flammable-liquid lockers, scaled by locker deck area and keel-laying date.",points:["Small lockers: one or two portable extinguishers located outside the entrance, depending on area and build date.","Larger lockers: a fixed system — CO₂ (≥40% of gross volume), dry powder (≥0.5 kg/m³), or water spray (≥5 L/m² of deck area per minute).","Thresholds tighten for newer vessels; post-2002 ships follow SOLAS II-2/10.6.3 and MSC.1/Circ.1275 guidance."],refs:"Marshall Islands Marine Notice 2-011-6 Rev. 2023. Source: ClassNK Technical Information No. TEC-1318 (26 Feb 2024).",link:"https://www.classnk.or.jp/hp/pdf/tech_info/tech_img/T1318e.pdf"},{id:"tec-1280",status:"active",date:"09/12/2022",kind:"regulation",title:"Fire Control Plan graphical symbols & verification — Panama",media:["structural"],effective:null,summary:"Panama Merchant Marine Circular MMC-277 on Fire Control Plan graphical symbols and their verification.",points:["IMO Res. A.952(23) symbols to be incorporated if a Fire Control Plan is reissued, especially for ships keel-laid on/after 1 Jan 2004.","IMO Res. A.1116(30) symbols to be used in combination with A.952(23) on ships constructed on/after 1 Jan 2019."],refs:"Panama MMC-277. Source: ClassNK Technical Information No. TEC-1280 (9 Dec 2022).",link:"https://www.classnk.or.jp/hp/pdf/tech_info/tech_img/T1280e.pdf"},{id:"tec-1256",status:"active",date:"08/02/2022",kind:"regulation",title:"Emergency escape breathing devices (EEBDs) — Cyprus",media:["ba"],effective:null,summary:"Cyprus Circular 41/2021 specifying the required arrangement and number of EEBDs.",points:["Both MSC/Circ.849 and MSC/Circ.1081 are to be followed.","At least one additional EEBD, clearly marked ‘training’, must be available on board solely for training, irrespective of the number in place.","Verified at the first SE periodical survey on/after 1 Jan 2022; Fire Control Plan and drawings to be revised accordingly."],refs:"Cyprus Circular 41/2021. Source: ClassNK Technical Information No. TEC-1256 (8 Feb 2022).",link:"https://www.classnk.or.jp/hp/pdf/tech_info/tech_img/T1256e.pdf"},{id:"tec-1232",status:"active",date:"20/04/2021",kind:"regulation",title:"Portable radio apparatus for fire-fighting parties — Malaysia",media:["ba","detection"],effective:null,summary:"Malaysia RO Instruction Rev 1.2020 on portable radio apparatus for fire-fighting parties (SOLAS II-2/10.10.4).",points:["At least two explosion-proof or intrinsically-safe 2-way UHF radiotelephones per fire party (number based on the muster list).","An additional two units to be carried for the command team.","Fire-fighter radios should be distinctively coloured; conformity certification retained on board for verification."],refs:"Malaysia RO Instruction Rev 1.2020; SOLAS II-2/10.10.4. Source: ClassNK Technical Information No. TEC-1232 (20 Apr 2021).",link:"https://www.classnk.or.jp/hp/pdf/tech_info/tech_img/T1232e.pdf"},{id:"tec-1213",status:"active",date:"04/11/2020",kind:"regulation",title:"Portable radios for fire-fighting parties — Liberia",media:["ba"],effective:null,summary:"Liberia Marine Notice FIR-001 Rev. 07/20 on portable radios for fire-fighting parties (SOLAS II-2/10.10.4).",points:["Each fire party must have at least two explosion-proof or intrinsically-safe portable radios dedicated to the fire party.","Total number depends on the number of fire parties on the muster list / SMS, not the number of fire-fighter's outfits.","Radios should be stored with the fire-fighter's outfit, or marked/coloured for ready identification."],refs:"Liberia Marine Notice FIR-001 Rev. 07/20; SOLAS II-2/10.10.4. Source: ClassNK Technical Information No. TEC-1213 (4 Nov 2020).",link:"https://www.classnk.or.jp/hp/pdf/tech_info/tech_img/T1213e.pdf"},{id:"tec-1181",status:"active",date:"19/04/2019",kind:"regulation",title:"Graphical symbols for Fire Control Plans — Cook Islands",media:["structural"],effective:null,summary:"Cook Islands Technical Circular 191/2018 on Fire Control Plan symbols and escape-route/equipment markings.",points:["For ships constructed on/after 1 Jan 2019 (and existing ships undergoing relevant repairs/alterations), Res. A.1116(30) to be used together with Res. A.952(23).","A.1116(30) harmonises SOLAS II-2/13, III/9, III/11 and III/20 markings with the ISO 24409 series."],refs:"Cook Islands Technical Circular 191/2018; IMO Res. A.1116(30) & A.952(23). Source: ClassNK Technical Information No. TEC-1181 (19 Apr 2019).",link:"https://www.classnk.or.jp/hp/pdf/tech_info/tech_img/T1181e.pdf"},{id:"tec-1178",status:"active",date:"19/03/2019",kind:"regulation",title:"Two-way portable radios for fire-fighter communication — Cook Islands",media:["ba"],effective:null,summary:"Cook Islands Technical Circular 179/2018 on fire-fighter communication (SOLAS II-2/10.10.4).",points:["At least two two-way portable radiotelephones per fire party, of explosion-proof or intrinsically-safe type.","Ships built on/after 1 Jul 2014 comply on delivery; earlier ships by the first survey after 1 Jul 2018.","Stored with the fire-fighter's outfit; conformity and battery condition checked at SE periodical surveys."],refs:"Cook Islands Technical Circular 179/2018; SOLAS II-2/10.10.4. Source: ClassNK Technical Information No. TEC-1178 (19 Mar 2019).",link:"https://www.classnk.or.jp/hp/pdf/tech_info/tech_img/T1178e.pdf"},{id:"tec-1176",status:"active",date:"22/02/2019",kind:"regulation",title:"Graphical symbols for Fire Control Plans — Malta",media:["structural"],effective:null,summary:"Malta Technical Notice SLS.30 Rev.1 on Fire Control Plan graphical symbols, by build date.",points:["Pre-2004 ships may continue with A.654(16) symbols.","Ships built 2004–2018: A.952(23) symbols.","Ships built on/after 1 Jan 2019 (or whose plans are revised): A.1116(30) in combination with A.952(23)."],refs:"Malta Technical Notice SLS.30 Rev.1; IMO Res. A.654(16)/A.952(23)/A.1116(30). Source: ClassNK Technical Information No. TEC-1176 (22 Feb 2019).",link:"https://www.classnk.or.jp/hp/pdf/tech_info/tech_img/T1176e.pdf"},{id:"tec-1168",status:"active",date:"27/12/2018",kind:"regulation",title:"Fire-fighter communication — Greece",media:["ba"],effective:null,summary:"Greek flag implementation of SOLAS II-2/10.10.4 fire-fighter communication (Ref. 2322.1/52275/2018).",points:["Fire-fighter radios are additional to other two-way radiotelephones required by SOLAS.","Radios kept on immediate-operation mode on constant charge, recorded in each fire party's equipment list, and shown on the fire safety plan.","Ships built on/after 1 Jan 2018 comply on delivery; earlier ships by the first SE periodical survey on/after 1 Jul 2019."],refs:"Greece Ref. 2322.1/52275/2018; SOLAS II-2/10.10.4. Source: ClassNK Technical Information No. TEC-1168 (27 Dec 2018).",link:"https://www.classnk.or.jp/hp/pdf/tech_info/tech_img/T1168e.pdf"},{id:"tec-1152",status:"active",date:"18/05/2018",kind:"regulation",title:"Exemption of 135 L foam extinguisher in boiler spaces — MSC.409(97)",media:["portable","foam"],effective:null,summary:"IMO Res. MSC.409(97): where boiler spaces are protected by the fixed local fire-extinguishing system required by SOLAS II-2/10.5.6, the 135 L foam extinguisher (or equivalent) of SOLAS II-2/10.5.1.2.2 is not required. In force 1 Jan 2020; early implementation per MSC.1/Circ.1566.",points:["Applies only where the boiler space has the required fixed local fire-extinguishing system.","ClassNK accepts a CO₂ extinguisher of ≥45 kg or a powder extinguisher of ≥40 kg as the ‘equivalent’ that may be removed.","If the extinguisher is removed, the Fire Control Plan must be revised by the master (no Class approval of the revision required)."],refs:"IMO Res. MSC.409(97); MSC.1/Circ.1566. Source: ClassNK Technical Information No. TEC-1152 (18 May 2018).",link:"https://www.classnk.or.jp/hp/pdf/tech_info/tech_img/T1152e.pdf"},{id:"tec-1027",status:"active",date:"22/05/2015",kind:"regulation",title:"Recharging of breathing-apparatus & spare cylinders — UK / Red Ensign group",media:["ba"],effective:null,summary:"Special requirements for recharging breathing-apparatus cylinders and spare cylinders for UK, Bermuda, British Virgin Islands, Cayman Islands, Gibraltar and Isle of Man flags.",points:["Where no on-board recharging means is provided, sufficient additional spare cylinders must be provided for training.","At least one fully-charged training cylinder per required SCBA set; cylinders for training to be prominently marked."],refs:"UK / Red Ensign group flag requirements. Source: ClassNK Technical Information No. TEC-1027 (22 May 2015).",link:"https://www.classnk.or.jp/hp/pdf/tech_info/tech_img/T1027e.pdf"},{id:"tec-1020",status:"active",date:"23/01/2015",kind:"regulation",title:"Recharging of breathing-apparatus & spare cylinders — St. Vincent & the Grenadines",media:["ba"],effective:null,summary:"St. Vincent and the Grenadines special requirements for recharging breathing-apparatus cylinders and spare cylinders.",points:["Where no on-board recharging means is provided, at least one spare cylinder for drills per fire-fighting team."],refs:"St. Vincent & the Grenadines flag requirement. Source: ClassNK Technical Information No. TEC-1020 (23 Jan 2015).",link:"https://www.classnk.or.jp/hp/pdf/tech_info/tech_img/T1020e.pdf"},{id:"tec-1016",status:"active",date:"26/12/2014",kind:"regulation",title:"Spare charges, additional extinguishers & refilling — Panama",media:["portable"],effective:null,summary:"Panama Merchant Marine Circular No. 281 on spare charges, additional portable fire extinguishers and refilling.",points:["Spare charges for 100% of the first 10 rechargeable extinguishers and 50% of the remainder (max 60 total).","For extinguishers that cannot be recharged on board, provide additional extinguishers of the same type/capacity/number instead.","Number/arrangement of additional extinguishers per MSC.1/Circ.1275; record additions in the Fire Control Plan."],refs:"Panama MMC-281; MSC.1/Circ.1275. Source: ClassNK Technical Information No. TEC-1016 (26 Dec 2014).",link:"https://www.classnk.or.jp/hp/pdf/tech_info/tech_img/T1016e.pdf"},{id:"tec-1011",status:"active",date:"05/11/2014",kind:"regulation",title:"Fire-fighter's outfit equipment — Antigua & Barbuda",media:["ba"],effective:null,summary:"Antigua and Barbuda special requirements for fire-fighter's outfit equipment: BA cylinder recharging and fire-fighter communication.",points:["At least two spare BA cylinders where recharging is met by spares, to allow a two-man team to drill.","Fire-fighter two-way radios are additional to SOLAS III radios, stowed with the outfits and ready for use.","Battery state-of-charge included in routine fire-fighting equipment inspections."],refs:"Antigua & Barbuda flag requirement; SOLAS II-2/10.10.4. Source: ClassNK Technical Information No. TEC-1011 (5 Nov 2014).",link:"https://www.classnk.or.jp/hp/pdf/tech_info/tech_img/T1011e.pdf"},{id:"tec-1009",status:"active",date:"21/10/2014",kind:"regulation",title:"Recharging of breathing-apparatus & spare cylinders — Singapore",media:["ba"],effective:null,summary:"Singapore special requirements for recharging breathing-apparatus cylinders and spare cylinders (SOLAS II-2/15.2.2.6).",points:["Where no on-board recharging is provided, the company determines the suitable number of spare cylinders for drills.","In no case fewer than two additional BA cylinders."],refs:"Singapore flag requirement; SOLAS II-2/15.2.2.6. Source: ClassNK Technical Information No. TEC-1009 (21 Oct 2014).",link:"https://www.classnk.or.jp/hp/pdf/tech_info/tech_img/T1009e.pdf"},{id:"tec-1008",status:"active",date:"10/10/2014",kind:"regulation",title:"Recharging of breathing-apparatus & spare cylinders — Bahamas",media:["ba"],effective:null,summary:"Bahamas special requirements for recharging breathing-apparatus cylinders and spare cylinde 700;background:#dc2626;color:#fff;border-radius:20px;padding:1px 6px;margin-left:2px}\n\n  /* safety alerts */\n  .alerts{max-width:100%}\n  .alerts-intro{font-size:13px;line-height:1.55;color:var(--ink-2);margin-bottom:18px;max-width:620px}\n  .alert{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;background:var(--paper)}\n  .alert-regulation{border-left:4px solid #b91c1c}\n  .alert-safety{border-left:4px solid #d97706}\n  .alert-head{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:9px}\n  .alert-badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:6px;white-space:nowrap}\n  .alert-badge-regulation{background:#fef2f2;color:#b91c1c}\n  .alert-badge-safety{background:#fffbeb;color:#92400e}\n  .alert-head h3{font-size:15.5px;font-weight:700;color:var(--ink);flex:1;min-width:200px}\n  .alert-eff{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:#b91c1c;background:#fef2f2;padding:3px 9px;border-radius:6px;white-space:nowrap}\n  .alert-status{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 9px;border-radius:20px;border:1px solid;white-space:nowrap}\n  .alert-date{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--ink-3);background:var(--bg);border:1px solid var(--line);padding:3px 9px;border-radius:6px;white-space:nowrap}\n  .alert-flash{animation:alertFlash 2s ease-out}\n  @keyframes alertFlash{0%{box-shadow:0 0 0 3px var(--accent-2);background:#ebf2fa}60%{box-shadow:0 0 0 3px var(--accent-2);background:#ebf2fa}100%{box-shadow:none}}\n  .alert-media{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}\n  .alert-tag{font-size:10.5px;font-weight:600;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);padding:2px 9px;border-radius:5px}\n  .alert-summary{font-size:13.5px;line-height:1.55;color:var(--ink);margin-bottom:11px}\n  .alert-points{list-style:none;margin:0 0 13px;padding:0;display:flex;flex-direction:column;gap:7px}\n  .alert-points li{position:relative;padding-left:18px;font-size:12.5px;line-height:1.5;color:var(--ink-2)}\n  .alert-points li::before{content:'';position:absolute;left:4px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--accent-2)}\n  .alert-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line-2);padding-top:11px}\n  .alert-refs{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-3);line-height:1.4}\n  .alert-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--accent-2);text-decoration:none;white-space:nowrap}\n  .alert-link:hover{text-decoration:underline}\n  .alert-link-off{color:var(--ink-3);cursor:not-allowed}\n  .alert-link-off:hover{text-decoration:none}\n\n  /* inline advisory marker on reference rows */\n  .row-advisory{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-family:inherit;font-size:11.5px;font-weight:600;text-align:left;border-radius:7px;padding:6px 10px;cursor:pointer;border:1px solid;width:100%}\n  .row-adv-wrap{margin-top:8px}\n  .row-adv-toggle{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;transition:.12s}\n  .row-adv-toggle:hover{border-color:#d97706;color:#92400e;background:#fffbeb}\n  .row-adv-toggle svg{flex-shrink:0}\n  .row-adv-toggle .row-adv-caret{transition:transform .15s}\n  .row-adv-toggle.open .row-adv-caret{transform:rotate(90deg)}\n  .row-adv-list{display:flex;flex-direction:column;gap:0}\n  .row-adv-list .row-advisory{margin-top:6px}\n  .row-advisory svg{flex-shrink:0}\n  .row-advisory-regulation{color:#b91c1c;background:#fef2f2;border-color:#fecaca}\n  .row-advisory-regulation:hover{background:#fee2e2}\n  .row-advisory-safety{color:#92400e;background:#fffbeb;border-color:#fde68a}\n  .row-advisory-safety:hover{background:#fef3c7}\n  .row-advisory-recommendation{color:#0e7490;background:#ecfeff;border-color:#a5f3fc}\n  .row-advisory-recommendation:hover{background:#cffafe}\n\n  /* alerts search + filters */\n  .alerts-search{display:flex;align-items:center;gap:9px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:0 12px;height:42px;margin-bottom:12px;max-width:520px}\n\n  /* Approved Service Supplier Lookup */\n  .css-lookup{max-width:900px}\n  .css-intro{font-size:13px;line-height:1.55;color:var(--ink-2);margin-bottom:16px;max-width:620px}\n  .css-search{max-width:520px;margin-bottom:18px}\n  .css-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}\n  .css-card{display:flex;align-items:center;gap:13px;text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;transition:.15s;position:relative}\n  .css-card:hover{border-color:var(--accent-2);box-shadow:0 3px 12px rgba(26,34,48,.09);transform:translateY(-1px)}\n  .css-card-pinned{border-color:#cfe5e0;background:#f6fbfa}\n  .css-card-pinned:hover{border-color:#04AA9E}\n  .css-initials{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:46px;height:46px;border-radius:10px;background:var(--accent-2);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:700;letter-spacing:-.02em}\n  .css-card-pinned .css-initials{background:#04AA9E}\n  .css-body{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}\n  .css-name{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.3}\n  .css-abbr{color:var(--ink-3);font-weight:500}\n  .css-cat{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-3)}\n  .css-ext{color:var(--ink-3);flex-shrink:0}\n  .css-card:hover .css-ext{color:
